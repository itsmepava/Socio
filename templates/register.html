{% extends 'base.html' %}{% block title %}Organization registration{% endblock %}{% block content %}<h1>Register an organization</h1><p>Registration requires platform approval before plans can be managed.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Organization name</label><input name="name" maxlength="120" required><label>Organization contact email</label><input name="organization_email" type="email" maxlength="254" required><label>Administrator login email</label><input name="email" type="email" maxlength="254" required><label>Password (12–128 characters)</label><input name="password" type="password" minlength="12" maxlength="128" required><button>Submit registration</button></form>{% endblock %}
